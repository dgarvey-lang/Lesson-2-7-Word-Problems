<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quadratic Word Problems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
/* Layout: sticky header with progress dots; two columns — question work on the left, whiteboard on the right (stacks on phones). */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --ink: #18202c;
  --muted: #586273;
  --line: #d8dde6;
  --accent: #2453c4;
  --accent-soft: #e6edfb;
  --accent-ink: #ffffff;
  --good: #1b7543;
  --good-bg: #e2f3e9;
  --bad: #b3232c;
  --bad-bg: #fbe6e7;
  --warn: #8f5600;
  --warn-bg: #fcf0d9;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 16px rgba(20, 30, 50, .06);
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-math: "Cambria Math", "STIX Two Math", "Latin Modern Math", math, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --surface: #171d27; --surface-2: #1c2330; --ink: #e5e9f0; --muted: #9aa4b4; --line: #2b3545;
    --accent: #86a8ff; --accent-soft: #1e2b47; --accent-ink: #0c1222;
    --good: #67d397; --good-bg: #13311f; --bad: #ff8f95; --bad-bg: #3b1a1d; --warn: #f3b85e; --warn-bg: #3a2b12;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171d27; --surface-2: #1c2330; --ink: #e5e9f0; --muted: #9aa4b4; --line: #2b3545;
  --accent: #86a8ff; --accent-soft: #1e2b47; --accent-ink: #0c1222;
  --good: #67d397; --good-bg: #13311f; --bad: #ff8f95; --bad-bg: #3b1a1d; --warn: #f3b85e; --warn-bg: #3a2b12;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
math { font-family: var(--font-math); }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 1.15rem; }
.brand span { font-size: .78rem; color: var(--muted); }
.dots { display: flex; flex-wrap: wrap; gap: 5px; flex: 1 1 260px; min-width: 0; }
.dot {
  width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface-2);
  font-size: .7rem; font-weight: 600; display: grid; place-items: center; color: var(--muted); padding: 0;
  font-variant-numeric: tabular-nums;
}
.dot.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.dot.retry { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.dot.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.dot.current { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.dot.extra { border-style: dashed; }
.top-actions { display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .9rem;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.help { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }

/* Main two-column layout */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px;
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1500px; margin: 0 auto;
}
.work { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }

/* Question card */
.q-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.badge { font-size: .72rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.equation {
  margin: 14px 0 4px; padding: 18px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line);
  font-size: 1.6rem; text-align: center; overflow-x: auto;
}
.step { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.step h3 { font-size: 1.02rem; display: flex; gap: 10px; align-items: center; }
.step-num {
  width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .8rem;
  display: grid; place-items: center; flex: none;
}
.methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.method {
  text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.method b { font-size: .92rem; }
.method small { color: var(--muted); font-size: .78rem; }
.method:hover:not(:disabled) { border-color: var(--accent); }
.method.sel { border-color: var(--accent); background: var(--accent-soft); }
.method.right { border-color: var(--good); background: var(--good-bg); }
.method.wrong { border-color: var(--bad); background: var(--bad-bg); }
.method.ok { border-color: var(--warn); background: var(--warn-bg); }
.method:disabled { cursor: default; }
.method:disabled:not(.right):not(.wrong):not(.ok) { opacity: .55; }

.feedback { border-radius: 10px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; font-size: .93rem; }
.feedback .icon { font-weight: 700; font-size: 1.1rem; line-height: 1.2; flex: none; width: 22px; text-align: center; }
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.feedback.warn { background: var(--warn-bg); color: var(--warn); }
.feedback p { margin: 0; color: var(--ink); }
.feedback strong { color: inherit; }

.answer-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.answer-row label { font-family: var(--font-math); font-size: 1.25rem; font-style: italic; }
.answer-row input {
  flex: 1 1 220px; min-width: 0; font: inherit; font-size: 1.05rem; padding: 10px 12px; border-radius: 8px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.keypad { display: flex; gap: 6px; flex-wrap: wrap; }
.key {
  min-width: 42px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2);
  font-size: 1rem; font-family: var(--font-math);
}
.key:hover { border-color: var(--accent); }
.preview { min-height: 38px; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--line); font-size: 1.15rem; overflow-x: auto; }
.preview .ph { font-family: var(--font-body); font-size: .85rem; color: var(--muted); }
.preview .err { font-family: var(--font-body); font-size: .85rem; color: var(--bad); }
.hint-line { font-size: .82rem; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.solution { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.solution h4 { margin: 0 0 8px; font-family: var(--font-display); font-size: .95rem; }
.solution ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.solution li p { margin: 0 0 2px; font-size: .9rem; color: var(--muted); }
.solution .m { font-size: 1.1rem; overflow-x: auto; }
.nav { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Summary */
.score-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.score { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface-2); }
.score b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.score span { font-size: .8rem; color: var(--muted); }
.table-wrap { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.strong { background: var(--good-bg); color: var(--good); }
.pill.weak { background: var(--bad-bg); color: var(--bad); }
.pill.none { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.help-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.help-item {
  border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 8px; padding: 12px 14px;
  display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap;
}
.help-item div { min-width: 0; flex: 1 1 260px; }
.help-item b { display: block; }
.help-item p { margin: 2px 0 0; font-size: .87rem; color: var(--muted); }
.muted { color: var(--muted); }

/* Whiteboard */
.board {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h, 64px) + 12px);
  height: calc(100vh - var(--header-h, 64px) - 36px - env(safe-area-inset-top, 0px));
  min-height: 420px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; min-width: 0;
}
.board-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.board-title { font-family: var(--font-display); font-weight: 600; font-size: .95rem; margin-right: auto; }
.tool {
  height: 32px; min-width: 32px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
  font-size: .8rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.tool.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swatch.on { box-shadow: 0 0 0 2px var(--accent); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.canvas-wrap {
  position: relative; flex: 1; min-height: 0; background-color: #ffffff;
  background-image: linear-gradient(#e9edf3 1px, transparent 1px), linear-gradient(90deg, #e9edf3 1px, transparent 1px);
  background-size: 28px 28px;
}
.canvas-wrap.nogrid { background-image: none; }
.canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

/* Help modal */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(10, 15, 25, .5); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-card { background: var(--surface); border-radius: 14px; width: min(720px, 100%); max-height: 100%; overflow-y: auto; box-shadow: var(--shadow); border: 1px solid var(--line); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.modal-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 22px; }
.modal-body h3 { font-size: 1rem; margin-bottom: 8px; }
.modal-body p { margin: 0 0 6px; }
.guide { display: grid; gap: 8px; }
.guide div { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: .88rem; align-items: center; }
.guide div b { color: var(--accent); }
.typing { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: .88rem; }
.typing code { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
.hint-steps { display: flex; flex-direction: column; gap: 10px; margin: 8px 0; }
.hint-steps .h { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
.hint-steps .h p { margin: 0 0 4px; font-size: .88rem; color: var(--muted); }
.hint-steps .m { font-size: 1.05rem; overflow-x: auto; }

[hidden] { display: none !important; }
.graph { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 12px; }
.graph h4 { margin: 0 0 8px; font-family: var(--font-display); font-size: .95rem; }
.graph p { margin: 8px 0 0; font-size: .9rem; }
.graph-svg { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.g-grid { stroke: var(--line); stroke-width: 1; }
.g-axis { stroke: var(--muted); stroke-width: 1.5; }
.g-curve { fill: none; stroke: var(--accent); stroke-width: 3; }
.g-dot { fill: var(--good); stroke: var(--surface); stroke-width: 2; }
.g-tick { fill: var(--muted); font: 13px var(--font-body); }
.g-lab { fill: var(--good); font: 600 15px var(--font-body); }

.problem { margin: 14px 0 4px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 1.02rem; line-height: 1.6; }
.method.eqc { align-items: center; justify-content: center; font-size: 1.12rem; min-height: 54px; overflow-x: auto; }
.unit { color: var(--muted); font-size: .88rem; }
.answer-row label { font-family: var(--font-body); font-style: normal; font-size: 1rem; font-weight: 600; }
.answer-row input { flex: 1 1 140px; max-width: 220px; }
.g-level { stroke: var(--warn); stroke-width: 2; stroke-dasharray: 6 5; }
.g-title { fill: var(--muted); font: 600 14px var(--font-body); }

@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .board { position: relative; top: auto; height: 520px; }
}
@media (max-width: 560px) {
  .methods { grid-template-columns: minmax(0, 1fr); }
  .score-row { grid-template-columns: minmax(0, 1fr); }
  .guide div { grid-template-columns: minmax(0, 1fr); }
  .equation { font-size: 1.3rem; }
  .panel { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .feedback { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>
</head><body>

<header class="top" id="top">
  <div class="brand">
    <h1>Quadratic Word Problems</h1>
    <span>Write the equation, pick a method, solve and interpret.</span>
  </div>
  <nav class="dots" id="dots" aria-label="Questions"></nav>
  <div class="top-actions">
    <button class="btn help" id="helpBtn" type="button">? Help</button>
    <button class="btn" id="summaryBtn" type="button">Summary</button>
  </div>
</header>

<main class="layout">
  <section class="work" id="work" aria-live="polite"></section>
  <aside class="board" aria-label="Whiteboard">
    <div class="board-bar">
      <span class="board-title" id="boardTitle">Whiteboard</span>
      <button class="swatch on" data-color="#18202c" style="background:#18202c" aria-label="Black pen" type="button"></button>
      <button class="swatch" data-color="#2453c4" style="background:#2453c4" aria-label="Blue pen" type="button"></button>
      <button class="swatch" data-color="#c62828" style="background:#c62828" aria-label="Red pen" type="button"></button>
      <button class="swatch" data-color="#1e7d3c" style="background:#1e7d3c" aria-label="Green pen" type="button"></button>
      <span class="sep"></span>
      <button class="tool on" id="penThin" type="button" title="Thin pen">Thin</button>
      <button class="tool" id="penThick" type="button" title="Thick pen">Thick</button>
      <button class="tool" id="eraser" type="button" title="Eraser">Eraser</button>
      <span class="sep"></span>
      <button class="tool" id="undo" type="button" title="Undo">Undo</button>
      <button class="tool" id="clear" type="button" title="Clear the board">Clear</button>
      <button class="tool on" id="grid" type="button" title="Show or hide grid">Grid</button>
    </div>
    <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas"></canvas></div>
  </aside>
</main>

<div class="modal" id="helpModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="modal-head">
      <h2 id="helpTitle" style="font-size:1.15rem">Help</h2>
      <button class="btn" id="helpClose" type="button">Close</button>
    </div>
    <div class="modal-body" id="helpBody"></div>
  </div>
</div>

<script>
"use strict";
/* ---------- Math rendering ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function texFallback(t) {
  let s = t;
  for (let i = 0; i < 4; i++) s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "($1)/($2)").replace(/\\sqrt\{([^{}]*)\}/g, "√($1)");
  return s.replace(/\\pm/g, "±").replace(/\\cdot/g, "·").replace(/\\times/g, "×").replace(/\\approx/g, "≈").replace(/\\Rightarrow/g, "⇒")
    .replace(/\\quad|\\qquad|\\;|\\,/g, " ").replace(/\\text\{([^}]*)\}/g, "$1")
    .replace(/\\left|\\right/g, "").replace(/\^2/g, "²").replace(/[{}]/g, "");
}
function M(tex, display) {
  try {
    if (window.katex) return katex.renderToString(tex, { output: "mathml", displayMode: !!display, throwOnError: false });
  } catch (e) { /* fall through */ }
  return `<span style="font-family:var(--font-math)">${esc(texFallback(tex))}</span>`;
}

/* ---------- Number helpers ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const nz = (a, b) => { let v; do { v = ri(a, b); } while (v === 0); return v; };
const isSq = n => n >= 0 && Number.isInteger(Math.sqrt(n));
function simpRad(n) { for (let k = Math.floor(Math.sqrt(n)); k > 1; k--) if (n % (k * k) === 0) return [k, n / (k * k)]; return [1, n]; }
const fmt = n => (n < 0 ? "−" + (-n) : "" + n);
const isInt = x => Math.abs(x - Math.round(x)) < 1e-9;
const d2 = x => (isInt(x) ? "" + Math.round(x) : x.toFixed(2)); /* value rounded to hundredths, as TeX/plain */
const ap = x => (isInt(x) ? "= " : "\\approx ") + d2(x);   /* "= 60" or "≈ 1.77" in TeX */
const apT = x => (isInt(x) ? "" : "about ") + d2(x);        /* plain words */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- TeX builders ---------- */
function coefTerm(c, v, first) {
  if (c === 0) return "";
  const abs = Math.abs(c), body = (v && abs === 1) ? v : abs + v;
  return first ? (c < 0 ? "-" : "") + body : (c < 0 ? " - " : " + ") + body;
}
function poly(cs, v = "x") { const vars = [v + "^2", v, ""]; let out = ""; cs.forEach((c, i) => { out += coefTerm(c, vars[i], out === ""); }); return out || "0"; }

/* Falling object: h(t) = −16t² + H, find when h = k */
function qDrop({ H, k = 0, obj, text, src }) {
  const diff = H - k, root = Math.sqrt(diff / 16), [s, t] = simpRad(diff);
  const eq = `-16t^2 + ${H} = ${k}`;
  const choices = shuffle([
    { tex: eq, ok: true },
    k ? { tex: `-16t^2 + ${H} = 0`, why: `Setting h(t) = 0 finds when it reaches the ground. Here it stops ${k} feet up, so set h(t) = ${k}.` }
      : { tex: `-16t^2 + ${H} = ${H}`, why: `h = ${H} is the starting height (at t = 0). The ground is where h = 0.` },
    { tex: `16t^2 + ${H} = ${k}`, why: "Keep the −16 from the model. Gravity pulls the object down, so the t² term is negative." },
    k ? { tex: `-16t^2 + ${k} = ${H}`, why: `The starting height, ${H}, stays in the function. The height you're looking for, ${k}, goes on the other side.` }
      : { tex: `-16t^2 = ${H}`, why: `Moving ${H} to the other side makes it −${H}, not ${H}.` },
  ]);
  const steps = [
    { t: `Let t = time in seconds. Set the height h(t) equal to ${k ? k + " feet" : "0 (the ground)"}.`, m: eq },
    { t: `Subtract ${H} from both sides.`, m: `-16t^2 = ${k - H}` },
    { t: "Divide both sides by −16.", m: `t^2 = ${frac(diff, 16)}` },
    { t: "Take the square root of both sides. Remember ±.", m: `t = \\pm\\sqrt{${frac(diff, 16)}} = \\pm ${ratRad(s, t, 4)} ${ap(root).replace(/^= /, "= \\pm ").replace(/^\\approx /, "\\approx \\pm ")}` },
    { t: "Interpret: time can't be negative, so reject the negative answer.", m: `t ${ap(root)}${T(" seconds")}` },
  ];
  return {
    skill: "drop", src, text, choices, best: "sqrt", alsoOk: [],
    eqHint: k ? `The ${obj} stops when it is ${k} feet above the ground, not at the ground. What should h(t) equal?` : "The ground is where the height is 0.",
    why: "There's no t term (no b term), so isolate t² and take the square root.",
    fields: [{ label: "t", unit: "seconds" }], sets: [[root]], reject: [-root], rejectMsg: "Time can't be negative. Keep only the positive solution.",
    ans: `t ${ap(root)}${T(" seconds")}`,
    interp: `It takes ${apT(root)} seconds for the ${obj} to ${k ? `reach a height of ${k} feet` : "hit the ground"}.`,
    graph: { f: [-16, 0, H], level: k, lo: 0, hi: Math.sqrt(H / 16) * 1.12, xl: "t (seconds)", yl: "h (feet)" }, steps,
  };
}
/* Thrown / hit object: h(t) = −16t² + bt + c, find when h = 0 */
function qProj({ b, c, obj, ground = "the ground", text, src }) {
  const a = -16, D = b * b - 4 * a * c, sq = Math.sqrt(D), r1 = (-b + sq) / (2 * a), r2 = (-b - sq) / (2 * a);
  const pos = Math.max(r1, r2), neg = Math.min(r1, r2), eq = `${poly([a, b, c], "t")} = 0`;
  const choices = shuffle([
    { tex: eq, ok: true },
    { tex: `${poly([a, b, c], "t")} = ${c}`, why: `h = ${c} is the starting height (at t = 0). Touching ${ground} means h = 0.` },
    { tex: `${poly([a, b, 0], "t")} = 0`, why: `The starting height, ${c}, is part of the model. Don't drop it.` },
    { tex: `${poly([16, b, c], "t")} = 0`, why: "Keep the −16 from the model. Gravity pulls the object down." },
  ]);
  const steps = [
    { t: `Let t = time in seconds. The ${obj} touches ${ground} when h(t) = 0.`, m: eq },
    { t: `a = −16, b = ${fmt(b)}, c = ${fmt(c)}. Find the discriminant.`, m: `b^2 - 4ac = (${b})^2 - 4(-16)(${c}) = ${D}` },
    { t: "Substitute into the quadratic formula.", m: `t = \\frac{${-b} \\pm \\sqrt{${D}}}{-32}` },
    { t: "Find both decimal values.", m: `t ${ap(pos)}${OR}t ${ap(neg)}` },
    { t: "Interpret: time can't be negative, so reject the negative answer.", m: `t ${ap(pos)}${T(" seconds")}` },
  ];
  return {
    skill: "projectile", src, text, choices, best: isSq(D) ? "factor" : "formula", alsoOk: isSq(D) ? ["formula"] : [],
    eqHint: `Touching ${ground} means the height is 0.`,
    why: `There's a t term, and b² − 4ac = ${D} isn't a perfect square, so it won't factor. Use the quadratic formula.`,
    fields: [{ label: "t", unit: "seconds" }], sets: [[pos]], reject: [neg], rejectMsg: "Time can't be negative. Keep only the positive solution.",
    ans: `t ${ap(pos)}${T(" seconds")}`,
    interp: `The ${obj} reaches ${ground} after ${apT(pos)} seconds${obj === "ball" && /court/.test(ground) ? ", so the other team has about that much time to hit it" : ""}.`,
    graph: { f: [a, b, c], level: 0, lo: 0, hi: pos * 1.12, xl: "t (seconds)", yl: "h (feet)" }, steps,
  };
}
/* Fence against a wall: w(F − 2w) = A */
function qFence({ F, A, unit = "m", place = "garden", wall = "fence", text, src }) {

  const eq = `w(${F} - 2w) = ${A}`;
  const choices = shuffle([
    { tex: eq, ok: true },
    { tex: `w(${F / 2} - w) = ${A}`, why: `That fences all four sides. The existing ${wall} is the fourth side, so the ${F} ${unit} only covers three sides: w + w + (${F} − 2w).` },
    { tex: `w(${F} - w) = ${A}`, why: `Two sides of length w need fencing, so the third side is ${F} − 2w, not ${F} − w.` },
    { tex: `2w + (${F} - 2w) = ${A}`, why: `That adds up the fencing. The ${A} ${unit}² is an area, and area = width × length.` },
  ]);
  const steps = [
    { t: `Let w = each side touching the ${wall} (there are 2) and ${F} − 2w = the side parallel to the ${wall}. Area = width × length.`, m: eq },
    { t: "Distribute, then set the equation equal to zero.", m: `${poly([-2, F, 0], "w")} = ${A} \\;\\Rightarrow\\; ${poly([2, -F, A], "w")} = 0` },
    { t: `a = 2, b = ${fmt(-F)}, c = ${A}. Find the discriminant.`, m: `b^2 - 4ac = (${-F})^2 - 4(2)(${A}) = ${D}` },
    { t: "Substitute into the quadratic formula.", m: `w = \\frac{${F} \\pm \\sqrt{${D}}}{4}\\quad w ${ap(w1)}${OR}w ${ap(w2)}` },
    { t: `Find the other side for each width: ${F} − 2w.`, m: `${F} - 2(${d2(w1)}) ${ap(l1)}\\qquad ${F} - 2(${d2(w2)}) ${ap(l2)}` },
    { t: "Interpret: both widths are positive and both lengths are positive, so both gardens work.", m: `${d2(w1)}${T(" " + unit)} \\times ${d2(l1)}${T(" " + unit)}${OR}${d2(w2)}${T(" " + unit)} \\times ${d2(l2)}${T(" " + unit)}` },

  return {

    why: `After you expand and set it equal to zero, b² − 4ac = ${D} isn't a perfect square, so it won't factor. Use the quadratic formula.`,
    fields: [{ label: "w", unit: `${unit} (each side touching the ${wall})` }, { label: "l", unit: `${unit} (side parallel to the ${wall})` }],
    sets: [[w1, l1], [w2, l2]], reject: [], rejectMsg: "",

    graph: { f: [-2, F, 0], level: A, lo: 0, hi: F / 2, xl: `w (${unit})`, yl: `Area (${unit}²)` }, steps,

/* Right triangle: legs add to S, hypotenuse c */
function qTri({ S, c, unit = "in", text, src }) {

    { tex: eq, ok: true },
    { tex: `x^2 + (${S} - x)^2 = ${c}`, why: "The Pythagorean theorem squares the hypotenuse too: a² + b² = c²." },
    { tex: `x^2 + ${c}^2 = (${S} - x)^2`, why: "The hypotenuse is the longest side, so it goes by itself: leg² + leg² = hypotenuse²." },
    { tex: `x(${S} - x) = ${c}^2`, why: "Use the Pythagorean theorem (a² + b² = c²), not a product of the legs." },
  ]);

    { t: `Let x = one leg. The legs add to ${S}, so the other leg is ${S} − x. Use a² + b² = c².`, m: eq },
    { t: `Expand (${S} − x)² as (${S} − x)(${S} − x).`, m: `x^2 + ${S * S} - ${2 * S}x + x^2 = ${c * c}` },
    { t: "Combine like terms and set the equation equal to zero.", m: `${poly([2, B, C], "x")} = 0` },
    { t: `a = 2, b = ${fmt(B)}, c = ${fmt(C)}. Find the discriminant.`, m: `b^2 - 4ac = (${B})^2 - 4(2)(${C}) = ${D}` },
    { t: "Substitute into the quadratic formula.", m: `x = \\frac{${-B} \\pm \\sqrt{${D}}}{4}\\quad x ${ap(x1)}${OR}x ${ap(x2)}` },
    { t: `Interpret: if one leg is ${d2(x1)}, the other is ${S} − ${d2(x1)} = ${d2(x2)}. The two solutions are the two legs.`, m: `${d2(x1)}${T(" " + unit)}${T(" and ")}${d2(x2)}${T(" " + unit)}` },
  ];

    skill: "triangle", src, text, choices, best: isSq(D) ? "factor" : "formula", alsoOk: isSq(D) ? ["formula"] : [],

    why: `After you expand and set it equal to zero, b² − 4ac = ${D} isn't a perfect square, so it won't factor. Use the quadratic formula.`,
    fields: [{ label: "Leg 1", unit }, { label: "Leg 2", unit }], sets: [[x1, x2], [x2, x1]], reject: [], rejectMsg: "",
    ans: `${d2(x1)}${T(" " + unit + " and ")}${d2(x2)}${T(" " + unit)}`,
    interp: `The legs are ${apT(x1)} ${unit} and ${apT(x2)} ${unit}. Check: they add to ${S}, and ${d2(x1)}² + ${d2(x2)}² ≈ ${c * c} = ${c}².`,

/* Two numbers: sum S = m + n, product P = mn */
function qNum({ m, n, text, src }) {
  const S = m + n, P = m * n, eq = `x(${S} - x) = ${P}`;
  const choices = shuffle([
    { tex: eq, ok: true },
    { tex: `x + (${S} - x) = ${P}`, why: `That's the sum again. "Product" means multiply: x(${S} − x).` },
    { tex: `x(${P} - x) = ${S}`, why: `The numbers add to ${S}, so the second number is ${S} − x, and their product is ${P}.` },
    { tex: `x(x + ${S}) = ${P}`, why: `If the numbers add to ${S} and one is x, the other is ${S} − x, not x + ${S}.` },
  ]);
  const steps = [
    { t: `Let x = the first number. They add to ${S}, so the second number is ${S} − x.`, m: eq },
    { t: "Distribute, then move everything to one side so the x² term is positive.", m: `${S}x - x^2 = ${P} \\;\\Rightarrow\\; ${poly([1, -S, P], "x")} = 0` },
    { t: `Find two numbers that multiply to ${P} and add to ${fmt(-S)}: ${fmt(-m)} and ${fmt(-n)}.`, m: `(x - ${m})(x - ${n}) = 0` },
    { t: "Set each factor equal to zero.", m: `x = ${m}${OR}x = ${n}` },
    { t: `Interpret: if x = ${m}, the other number is ${S} − ${m} = ${n} (and the reverse). Either way, the numbers are ${m} and ${n}.`, m: `${m}${T(" and ")}${n}` },
  ];

    skill: "numbers", src, text, choices, best: "factor", alsoOk: [],
    eqHint: `Call the first number x. If they add to ${S}, the second number is ${S} − x. Now write their product.`,
    why: `Set it equal to zero: x² − ${S}x + ${P} = 0. Two numbers multiply to ${P} and add to −${S}, so it factors.`,
    fields: [{ label: "First number", unit: "" }, { label: "Second number", unit: "" }], sets: [[m, n], [n, m]], reject: [], rejectMsg: "",
    ans: `${m}${T(" and ")}${n}`,

/* Rectangle: length = k·w + d, area A = w·length */
function qRect({ k, d, w0, unit = "yards", thing = "field", text, src }) {
  const l0 = k * w0 + d, A = w0 * l0, lw = binom(k, d, "w"), eq = `w(${lw}) = ${A}`, neg = -l0 / k;
  const kWord = k === 2 ? "twice" : `${k} times`, phrase = `${Math.abs(d)} ${d < 0 ? "fewer" : "more"} than ${kWord} its width`;
  const choices = shuffle([
    { tex: eq, ok: true },
    { tex: `w(${binom(k, -d, "w")}) = ${A}`, why: `"${phrase}" means ${k}w ${d < 0 ? "−" : "+"} ${Math.abs(d)}.` },
    { tex: `2w + 2(${lw}) = ${A}`, why: `That's the perimeter. The ${A} is an area, and area = width × length.` },
    { tex: `w + (${lw}) = ${A}`, why: "Area means multiply width × length, not add them." },
  ]);
  const steps = [
    { t: `Let w = the width. The length is ${phrase}: ${k}w ${d < 0 ? "−" : "+"} ${Math.abs(d)}. Area = width × length.`, m: eq },
    { t: "Distribute, then set the equation equal to zero.", m: `${poly([k, d, -A], "w")} = 0` },
  ];
  if (d % k === 0) {
    steps.push({ t: `Factor out the GCF, ${k}.`, m: `${k}(${poly([1, d / k, -A / k], "w")}) = 0` });
    steps.push({ t: `Find two numbers that multiply to ${fmt(-A / k)} and add to ${fmt(d / k)}: ${fmt(-w0)} and ${fmt(l0 / k)}.`, m: `${k}(w - ${w0})(w + ${l0 / k}) = 0` });

    steps.push({ t: `Factor with the a·c method: a·c = ${fmt(-k * A)}; ${fmt(l0)} and ${fmt(-k * w0)} multiply to that and add to ${fmt(d)}.`, m: `(w - ${w0})(${k}w + ${l0}) = 0` });
  }
  steps.push({ t: "Set each factor equal to zero.", m: `w = ${w0}${OR}w = ${frac(-l0, k)}` });
  steps.push({ t: `Interpret: a width can't be negative, so w = ${w0}. The length is ${k}(${w0}) ${d < 0 ? "−" : "+"} ${Math.abs(d)} = ${l0}.`, m: `${w0}${T(" " + unit + " by ")}${l0}${T(" " + unit)}` });
  return {
    skill: "rect", src, text, choices, best: "factor", alsoOk: ["formula"],

    why: `Set it equal to zero${d % k === 0 ? ` and factor out the GCF, ${k}` : ""}. It factors, so factoring works. With numbers this big, the quadratic formula is a fine choice too.`,
    fields: [{ label: "width", unit }, { label: "length", unit }], sets: [[w0, l0]], reject: [neg],
    rejectMsg: "A width can't be negative. Reject the negative solution, then find the length from the positive width.",
    ans: `${w0}${T(" " + unit + " by ")}${l0}${T(" " + unit)}`,
    interp: `The ${thing} is ${w0} ${unit} wide and ${l0} ${unit} long. Check: ${w0} × ${l0} = ${A.toLocaleString("en-US")}.`,
    graph: { f: [k, d, 0], level: A, lo: 0, hi: w0 * 1.3, xl: `w (${unit})`, yl: "Area" }, steps,
  };

    const methodChecked = rs.filter(r => r.methodStatus), methodRight = methodChecked.filter(r => r.methodOk).length;
    const firstRight = answered.filter(r => r.firstOk && !r.revealed).length;
    const eqWeak = key !== "interpret" && eqRight < eqChecked.length;
    const methodWeak = key !== "interpret" && methodRight < methodChecked.length;
    const answerWeak = key === "interpret" ? answered.some(r => r.interpIssue) : answered.some(r => !r.firstOk || r.revealed);
    const status = !rs.length ? "none" : (eqWeak || methodWeak || answerWeak) ? "weak" : "strong";
    rows.push({ key, done: answered.length, eqChecked: eqChecked.length, eqRight, methodChecked: methodChecked.length, methodRight, firstRight, status, eqWeak, methodWeak, answerWeak });
  }
  return rows;
}
function renderSummary() {
  const rows = analyze(), all = state.questions.map(q => state.res[q.id]).filter(Boolean);
  const answered = all.filter(r => r.attempts || r.revealed), eqChecked = all.filter(r => r.eqStatus), methodChecked = all.filter(r => r.methodStatus);
  const unanswered = state.questions.length - answered.length, weak = rows.filter(r => r.status === "weak");
  let h = `<div class="panel"><span class="eyebrow">Your results</span><h2 style="font-size:1.5rem;margin-top:4px">Summary</h2>
    <div class="score-row">
      <div class="score"><b>${eqChecked.filter(r => r.eqStatus === "right").length}/${eqChecked.length}</b><span>equations set up correctly</span></div>
      <div class="score"><b>${methodChecked.filter(r => r.methodOk).length}/${methodChecked.length}</b><span>best method chosen</span></div>
      <div class="score"><b>${answered.filter(r => r.firstOk && !r.revealed).length}/${answered.length}</b><span>answers right on the first try</span></div>
    </div>
    ${unanswered ? `<p class="muted" style="margin:12px 0 0">${unanswered} question${unanswered === 1 ? " is" : "s are"} not finished yet. Click a number at the top to go back.</p>` : ""}
  </div>`;
  h += `<div class="panel"><h3 style="font-size:1.1rem">What you need more help on</h3>`;
  if (!answered.length && !eqChecked.length) h += `<p class="muted">Answer some questions first, then come back here to see what to practice.</p>`;
  else if (!weak.length) h += `<p>Great job! You set up and solved every type correctly on the first try. Add more questions of any type below if you want extra practice.</p>`;
  else {
    h += `<div class="help-list">${weak.map(r => {
      const why = [r.eqWeak ? "writing the equation" : "", r.methodWeak ? "choosing the method" : "", r.answerWeak ? (r.key === "interpret" ? "keeping only answers that make sense" : "getting the answer") : ""].filter(Boolean).join(", ");
      return `<div class="help-item"><div><b>${SKILLS[r.key].name}</b><p>${why ? `Trouble with ${why}. ` : ""}${esc(SKILLS[r.key].tip)}</p></div>
        <button class="btn primary" data-more="${r.key}" type="button">+ Add 3 more</button></div>`;
    }).join("")}</div>
    <div class="actions" style="margin-top:14px"><button class="btn primary" id="moreAll" type="button">+ Add practice for all of these (mixed)</button></div>`;
  }
  h += `</div>`;
  h += `<div class="panel"><h3 style="font-size:1.1rem">Results by problem type</h3><div class="table-wrap"><table>
    <thead><tr><th>Type</th><th>Equation</th><th>Method</th><th>1st try</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${SKILLS[r.key].name}</td>
      <td class="num">${r.key === "interpret" ? "—" : `${r.eqRight}/${r.eqChecked}`}</td>
      <td class="num">${r.key === "interpret" ? "—" : `${r.methodRight}/${r.methodChecked}`}</td>
      <td class="num">${r.firstRight}/${r.done}</td>
      <td><span class="pill ${r.status}">${r.status === "weak" ? "Needs practice" : r.status === "strong" ? "Got it" : "Not started"}</span></td>
      <td><button class="btn" data-more="${r.key}" type="button" style="padding:5px 10px;font-size:.8rem">+ 3 more</button></td></tr>`).join("")}
    </tbody></table></div></div>`;
  h += `<div class="nav"><button class="btn" id="backQ" type="button">← Back to questions</button>
    <button class="btn" id="restart" type="button">Start over</button></div>`;
  work.innerHTML = h;
}
function addMore(keys, per) {
  const seen = new Set(state.questions.map(q => q.text)), fresh = [];
  for (const k of keys) for (let i = 0; i < per; i++) {
    let q, tries = 0; do { q = GEN[k](); tries++; } while (seen.has(q.text) && tries < 30);
    seen.add(q.text); fresh.push(q);
  }
  if (keys.length > 1) shuffle(fresh);
  const start = state.questions.length;
  fresh.forEach(q => { q.id = "q" + state.nextId++; q.extra = true; state.questions.push(q); });
  state.cur = start; state.view = "q"; render(); window.scrollTo({ top: 0 });
}

/* ---------- Help ---------- */
let helpSteps = 0;
function openHelp() { helpSteps = 0; renderHelp(); $("#helpModal").hidden = false; $("#helpClose").focus(); }
function closeHelp() { $("#helpModal").hidden = true; }
function methodHint(q) {
  return {
    drop: "Is there a t term? If not, get t² by itself.",
    projectile: "There's a t term. Check b² − 4ac: is it a perfect square?",
    fence: "Expand and set it equal to zero first. Then check b² − 4ac: is it a perfect square?",
    triangle: "Expand and set it equal to zero first. Then check b² − 4ac: is it a perfect square?",
    numbers: "Set it equal to zero. Can you find two numbers that multiply to c and add to b?",
    rect: "Set it equal to zero and look for a GCF. Can you find two numbers that multiply to c and add to b?",
  }[q.skill];
}
function renderHelp() {
  const q = state.view === "q" ? state.questions[state.cur] : null;
  let h = "";
  if (q) {
    const r = R(q.id);
    h += `<section><h3>Hint for question ${state.cur + 1}</h3>`;
    if (r.eqStatus === null || r.methodStatus === null) {
      const isEq = r.eqStatus === null;
      h += `<p class="muted">${isEq ? "Start by writing the equation. Define a variable first." : "Now choose a method. Use the guide below to decide."}</p>`;
      if (helpSteps > 0) h += `<div class="hint-steps"><div class="h"><p>${isEq ? "Equation hint" : "Method hint"}</p><div>${esc(isEq ? q.eqHint : methodHint(q))}</div></div></div>`;
      else h += `<button class="btn" id="hintNext" type="button">Show ${isEq ? "an equation" : "a method"} hint</button>`;
    } else {
      h += `<p class="muted">Each click shows one more step of the solution.</p><div class="hint-steps">${q.steps.slice(0, helpSteps).map((s, i) => `<div class="h"><p>Step ${i + 1}: ${esc(s.t)}</p><div class="m">${M(s.m)}</div></div>`).join("")}</div>`;
      if (helpSteps < q.steps.length) h += `<button class="btn" id="hintNext" type="button">${helpSteps ? "Show the next step" : "Show the first step"}</button>`;
      else h += `<p class="muted">That's every step. Type the final answer in the box${q.fields.length > 1 ? "es" : ""}.</p>`;
    }
    h += `</section>`;
  }
  h += `<section><h3>Solving a word problem</h3><div class="guide">
    <div><span>1. Define your variable</span><b>"Let t = time in seconds"</b></div>
    <div><span>2. Write the equation</span><b>Use the model or a formula</b></div>
    <div><span>3. Solve</span><b>Pick the best method</b></div>
    <div><span>4. Interpret</span><b>Keep only answers that make sense, rounded to hundredths</b></div>
  </div></section>
  <section><h3>Common setups</h3><div class="guide">
    <div><span>Dropped object hits the ground</span><b>${M("-16t^2 + h_0 = 0")}</b></div>
    <div><span>Thrown or hit object hits the ground</span><b>${M("-16t^2 + v_0t + h_0 = 0")}</b></div>
    <div><span>Fence on 3 sides (wall on the 4th)</span><b>${M("w(F - 2w) = A")}</b></div>
    <div><span>Right triangle, legs add to S</span><b>${M("x^2 + (S - x)^2 = c^2")}</b></div>
    <div><span>Two numbers with sum S and product P</span><b>${M("x(S - x) = P")}</b></div>
    <div><span>Rectangle with area A</span><b>${M("w \\cdot \\text{length} = A")}</b></div>
  </div></section>
  <section><h3>How to pick the method</h3><div class="guide">
    <div><span>No b term, like −16t² + 50 = 0</span><b>Taking square roots</b></div>
    <div><span>Equal to zero, and factors of a·c add to b</span><b>Factoring</b></div>
    <div><span>b² − 4ac isn't a perfect square</span><b>Quadratic formula</b></div>
    <div><span>Supporting or checking your answer</span><b>Graphing, with key points labeled</b></div>
  </div></section>
  <section><h3>How to type answers</h3><div class="typing">
    <code>1.77</code><span>Decimals rounded to the nearest hundredth</span>
    <code>6600</code><span>Whole numbers (6,600 works too)</span>
    <code>sqrt(50)/4</code><span>Exact answers work too</span>
    <code>16.12</code><span>One value per box. Units are optional.</span>
  </div></section>`;
  $("#helpBody").innerHTML = h;
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const q = state.view === "q" ? state.questions[state.cur] : null;
  if (t.matches(".dot")) { state.cur = +t.dataset.i; state.view = "q"; render(); return; }
  if (t.id === "helpBtn" || t.hasAttribute("data-help")) { openHelp(); return; }
  if (t.id === "helpClose") { closeHelp(); return; }
  if (t.id === "hintNext") { helpSteps++; if (q) { R(q.id).hints++; save(); } renderHelp(); return; }
  if (t.id === "summaryBtn" || t.id === "toSummary") { state.view = "summary"; render(); window.scrollTo({ top: 0 }); return; }
  if (t.id === "backQ") { state.view = "q"; render(); return; }
  if (t.id === "prev") { state.cur--; render(); window.scrollTo({ top: 0 }); return; }
  if (t.id === "next") { state.cur++; render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.more) { addMore([t.dataset.more], 3); return; }
  if (t.id === "moreAll") { addMore(analyze().filter(r => r.status === "weak").map(r => r.key), 2); return; }
  if (t.id === "restart") {
    if (t.dataset.confirm) { state = fresh(); Board.reset(); render(); return; }
    t.dataset.confirm = "1"; t.textContent = "Click again to erase all progress"; t.classList.add("primary"); return;
  }
  if (!q) return;
  const r = R(q.id);
  if (t.dataset.eq !== undefined && r.eqStatus === null) { r.eqPick = +t.dataset.eq; renderQuestion(); save(); return; }
  if (t.id === "checkEq" && r.eqPick !== null) { r.eqStatus = q.choices[r.eqPick].ok ? "right" : "wrong"; render(); return; }
  if (t.dataset.method && r.methodStatus === null) { r.method = t.dataset.method; renderQuestion(); save(); return; }
  if (t.id === "checkMethod" && r.method) {
    r.methodStatus = methodStatusFor(q, r.method); r.methodOk = r.methodStatus !== "wrong";
    lastField = 0; render(); setTimeout(() => $("#ans0") && $("#ans0").focus(), 0); return;
  }
  if (t.dataset.ins !== undefined) { insertAtCursor(t.dataset.ins); return; }
  if (t.id === "checkAns") { doCheck(); return; }
  if (t.id === "reveal") { r.revealed = true; r.last = { status: "revealed" }; if (r.firstOk === null) r.firstOk = false; render(); return; }
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("ans")) lastField = +e.target.dataset.field; });
document.addEventListener("input", e => {
  if (e.target.classList && e.target.classList.contains("ans")) {
    const q = state.questions[state.cur]; state.drafts = state.drafts || {};
    const d = state.drafts[q.id] = state.drafts[q.id] || []; d[+e.target.dataset.field] = e.target.value; save();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#helpModal").hidden) closeHelp();
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("ans")) { e.preventDefault(); doCheck(); }
});
$("#helpModal").addEventListener("click", e => { if (e.target.id === "helpModal") closeHelp(); });
function insertAtCursor(txt) {
  const inp = $("#ans" + lastField) || $("#ans0"); if (!inp || inp.disabled) return;
  const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0, s) + txt + inp.value.slice(en);
  const pos = s + (txt === "()" ? 1 : txt.length);
  inp.focus(); inp.setSelectionRange(pos, pos);
  inp.dispatchEvent(new Event("input", { bubbles: true }));
}
function doCheck() {
  const q = state.questions[state.cur], r = R(q.id);
  if (!$("#ans0") || r.solved || r.revealed) return;
  const raws = q.fields.map((f, i) => $("#ans" + i).value);
  let res;
  try { res = checkAnswer(q, raws); } catch (err) { res = { status: "error", msg: err.message }; }
  r.last = res;
  if (res.status !== "error") {
    r.attempts++;
    if (r.attempts === 1) r.firstOk = res.status === "correct";
    if (res.interp) r.interpIssue = true;
    if (res.status === "correct") r.solved = true;
  }
  render();
  const again = $("#ans" + lastField); if (again && !again.disabled) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
}

/* ---------- Whiteboard ---------- */
const Board = {
  canvas: $("#canvas"), wrap: $("#canvasWrap"), ctx: null, key: null, boards: {},
  color: "#18202c", size: 2.5, erase: false, cur: null,
  init() {
    this.ctx = this.canvas.getContext("2d");
    new ResizeObserver(() => this.resize()).observe(this.wrap);
    const c = this.canvas;
    c.addEventListener("pointerdown", e => this.down(e));
    c.addEventListener("pointermove", e => this.move(e));
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev => c.addEventListener(ev, () => this.up()));
    document.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => {
      this.color = b.dataset.color; this.erase = false;
      document.querySelectorAll(".swatch").forEach(x => x.classList.toggle("on", x === b)); $("#eraser").classList.remove("on");
    }));
    $("#penThin").addEventListener("click", () => { this.size = 2.5; this.erase = false; this.tools("penThin"); });
    $("#penThick").addEventListener("click", () => { this.size = 6; this.erase = false; this.tools("penThick"); });
    $("#eraser").addEventListener("click", () => { this.erase = true; this.tools("eraser"); });
    $("#undo").addEventListener("click", () => this.undo());
    $("#clear").addEventListener("click", () => { const b = this.board(); if (!b.strokes.length) return; b.history.push({ clear: b.strokes }); b.strokes = []; this.redraw(); });
    $("#grid").addEventListener("click", e => { this.wrap.classList.toggle("nogrid"); e.currentTarget.classList.toggle("on"); });
  },
  tools(id) { ["penThin", "penThick", "eraser"].forEach(x => $("#" + x).classList.toggle("on", x === id)); },
  board() { return (this.boards[this.key] = this.boards[this.key] || { strokes: [], history: [] }); },
  setKey(k, title) { $("#boardTitle").textContent = title; if (this.key === k) return; this.key = k; this.redraw(); },
  reset() { this.boards = {}; this.redraw(); },
  resize() {
    const r = this.wrap.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    this.canvas.width = Math.max(1, Math.round(r.width * d)); this.canvas.height = Math.max(1, Math.round(r.height * d));
    this.ctx.setTransform(d, 0, 0, d, 0, 0); this.redraw();
  },
  pt(e) { const r = this.canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; },
  down(e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    this.canvas.setPointerCapture(e.pointerId);
    this.cur = { color: this.color, size: this.erase ? 22 : this.size, erase: this.erase, pts: [this.pt(e)] };
    this.drawStroke(this.cur);
  },
  move(e) {
    if (!this.cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ce of (evs.length ? evs : [e])) {
      const p = this.pt(ce), pts = this.cur.pts, last = pts[pts.length - 1];
      pts.push(p); this.segment(this.cur, last, p);
    }
  },
  up() {
    if (!this.cur) return;
    const b = this.board(); b.strokes.push(this.cur); b.history.push({ stroke: true }); this.cur = null;
  },
  style(s) {
    const x = this.ctx; x.globalCompositeOperation = s.erase ? "destination-out" : "source-over";
    x.strokeStyle = s.color; x.fillStyle = s.color; x.lineWidth = s.size; x.lineCap = "round"; x.lineJoin = "round";
  },
  segment(s, a, b) { const x = this.ctx; this.style(s); x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke(); },
  drawStroke(s) {
    const x = this.ctx; this.style(s);
    if (s.pts.length === 1) { x.beginPath(); x.arc(s.pts[0][0], s.pts[0][1], s.size / 2, 0, Math.PI * 2); x.fill(); return; }
    x.beginPath(); x.moveTo(s.pts[0][0], s.pts[0][1]);
    for (let i = 1; i < s.pts.length; i++) x.lineTo(s.pts[i][0], s.pts[i][1]);
    x.stroke();
  },
  redraw() {
    if (!this.ctx) return;
    const x = this.ctx; x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, this.canvas.width, this.canvas.height); x.restore();
    if (this.key) this.board().strokes.forEach(s => this.drawStroke(s));
    x.globalCompositeOperation = "source-over";
  },
  undo() {
    const b = this.board(), h = b.history.pop(); if (!h) return;
    if (h.clear) b.strokes = h.clear; else b.strokes.pop();
    this.redraw();
  },
};

function measureHeader() { document.documentElement.style.setProperty("--header-h", $("#top").offsetHeight + "px"); }
new ResizeObserver(measureHeader).observe($("#top"));
Board.init();
measureHeader();
render();
</script>
